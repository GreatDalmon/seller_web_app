{% extends 'seller_app/base.html' %}
{% block title %}Password changed | Seller Ops{% endblock %}
{% block header %}All set{% endblock %}

{% block content %}
<div class="pt-4 text-center">
    <div class="w-14 h-14 mx-auto bg-brand-100 text-brand-700 rounded-full flex items-center justify-center mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="text-xl font-extrabold text-brand-900">Password changed</h2>
    <p class="text-sm text-stone-600 mt-2">You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn mt-6">Log in</a>
</div>
{% endblock %}
