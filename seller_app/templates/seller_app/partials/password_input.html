<div class="relative">
    <input type="password" id="{{ id }}" name="{{ name }}" required
           {% if minlength %}minlength="{{ minlength }}"{% endif %}
           autocomplete="{{ autocomplete }}" placeholder="{{ placeholder }}" class="input pr-12">
    <button type="button" data-toggle-pw="{{ id }}" aria-label="Show password" aria-pressed="false"
            class="absolute inset-y-0 right-0 px-3.5 flex items-center text-stone-400 hover:text-brand-700">
        <svg data-eye class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg data-eye-off class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.2 3.9M6.6 6.7A16.6 16.6 0 002 12s3.6 6 10 6c1.5 0 2.8-.3 4-.8M9.9 9.9a3 3 0 004.2 4.2"/></svg>
    </button>
</div>
