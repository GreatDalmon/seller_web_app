{% extends 'seller_app/base.html' %}
{% block title %}Create account | Seller Ops{% endblock %}
{% block header %}Create account{% endblock %}

{% block content %}
<div class="pt-2">
    <div class="text-center mb-5">
        <h2 class="text-2xl font-extrabold text-stone-800">New seller</h2>
        <p class="text-sm text-stone-500 mt-1">Start tracking your business today.</p>
    </div>

    <form method="POST" action="{% url 'register' %}" class="card p-5 space-y-4">
        {% csrf_token %}
        <div>
            <label class="label" for="username">Your name</label>
            <input type="text" id="username" name="username" required value="{{ form.username }}" autocomplete="name"
                   class="input" placeholder="e.g. Joy Okafor">
        </div>
        <div>
            <label class="label" for="business_name">Business name <span class="font-normal text-stone-400">(optional)</span></label>
            <input type="text" id="business_name" name="business_name" value="{{ form.business_name }}"
                   class="input" placeholder="e.g. Joy's Fashion Hub">
        </div>
        <div>
            <label class="label" for="phone_number">Phone number (your login)</label>
            <input type="tel" id="phone_number" name="phone_number" required value="{{ form.phone_number }}" inputmode="tel" autocomplete="tel"
                   class="input" placeholder="e.g. 08012345678">
        </div>
        <div>
            <label class="label" for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                   class="input" placeholder="At least 8 characters">
        </div>
        <button type="submit" class="btn">Register &amp; start selling</button>
    </form>

    <p class="text-center text-sm text-stone-500 mt-6">
        Already have an account? <a href="{% url 'login' %}" class="text-brand-700 font-semibold hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
