<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15803d">
    <title>Offline | Seller Ops</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f7f5ef;
               font-family:system-ui,sans-serif; color:#292524; text-align:center; padding:24px; }
        .mark { width:64px; height:64px; border-radius:18px; background:#15803d; color:#fff; font-size:32px; font-weight:800;
                display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
        h1 { font-size:22px; margin:0 0 8px; }
        p { color:#78716c; font-size:14px; margin:0 0 20px; }
        button { background:#15803d; color:#fff; border:0; border-radius:12px; padding:12px 24px; font-weight:600; font-size:14px; }
    </style>
</head>
<body>
    <div>
        <div class="mark">₦</div>
        <h1>You're offline</h1>
        <p>Seller Ops needs a connection to save your sales and stock. Check your network and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
